<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>羽球輪抽配對</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: single column. Latest round on top, rosters below, sticky draw bar at bottom. Court-blue accent, shuttle-yellow number chips. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #14202e;
  --muted: #5b6b7c;
  --line: #d8e0e8;
  --accent: #1f55c9;
  --accent-fg: #ffffff;
  --chip: #f6d84a;
  --chip-fg: #3b3000;
  --team: #e8effb;
  --warn: #b8470f;
  --ok: #17794f;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151d; --surface: #17212c; --fg: #e7eef6; --muted: #93a4b6; --line: #28374a;
    --accent: #6c9bff; --accent-fg: #08142e; --chip: #e9c93a; --chip-fg: #2b2300; --team: #1e2e47;
    --warn: #ff9a66; --ok: #5ed39b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151d; --surface: #17212c; --fg: #e7eef6; --muted: #93a4b6; --line: #28374a;
  --accent: #6c9bff; --accent-fg: #08142e; --chip: #e9c93a; --chip-fg: #2b2300; --team: #1e2e47;
  --warn: #ff9a66; --ok: #5ed39b; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 150px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-weight: 900; font-size: 1.5rem; margin: 0; letter-spacing: .02em; }
h2 { font-size: 1rem; margin: 0; font-weight: 700; }
.sub { color: var(--muted); font-size: .875rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); color: var(--fg); font: inherit; padding: 10px 8px; min-height: 44px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
textarea, input[type="text"] { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
.lab { width: 8em; font-weight: 700; }
textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.meta { font-family: var(--font-mono); font-size: .8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.small-btn { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: .875rem; cursor: pointer; min-height: 40px; }
.round { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.round.latest { border-color: var(--accent); border-width: 2px; }
.round-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.gname { font-weight: 700; }
.roster { display: flex; flex-wrap: wrap; gap: 6px; }
.rc { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 2px; font-size: .9375rem; }
.no { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; border-radius: 13px; background: var(--chip); color: var(--chip-fg); font-family: var(--font-mono); font-weight: 500; font-size: .875rem; font-variant-numeric: tabular-nums; padding: 0 6px; }
.match { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.court { font-family: var(--font-mono); font-size: .8125rem; color: var(--muted); writing-mode: horizontal-tb; min-width: 3.5em; }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: stretch; min-width: 0; }
.team { background: var(--team); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.p { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 700; }
.p span.t { overflow-wrap: anywhere; min-width: 0; }
.vs { align-self: center; color: var(--muted); font-size: .8125rem; }
.bench { color: var(--muted); font-size: .9375rem; }
.rep { font-size: .8125rem; }
.rep.good { color: var(--ok); }
.rep.bad { color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent);
  padding-top: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
#draw { min-height: 58px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 900; font-size: 1.25rem; letter-spacing: .1em; cursor: pointer; }
#redo { min-height: 58px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); font: inherit; padding: 0 16px; cursor: pointer; }
#draw:active { transform: scale(.98); }
button:disabled { opacity: .5; cursor: default; }
.msg { color: var(--warn); font-size: .875rem; min-height: 1.3em; }
@media (max-width: 420px) { .teams { grid-template-columns: 1fr; } .vs { justify-self: center; } .lab { width: 6em; } }
</style>

</head>
<body>
<div class="wrap">
  <div>
    <h1>羽球輪抽配對</h1>
    <div class="sub">每人抽號碼，1、2 號同隊打 3、4 號，5、6 號同隊打 7、8 號，依此類推。會盡量避開重複的隊友和對手。</div>
  </div>

  <section class="panel">
    <h2>抽法</h2>
    <div class="seg" role="group" aria-label="抽法">
      <button type="button" id="m-mix" aria-pressed="true">兩組混在一起抽</button>
      <button type="button" id="m-sep" aria-pressed="false">兩組分開抽</button>
    </div>
    <div class="sub" id="mode-note"></div>
  </section>

  <section class="panel">
    <div class="row"><input type="text" class="lab" id="l1" value="A組" aria-label="第一組名稱"><span class="meta" id="c1"></span></div>
    <textarea id="g1" spellcheck="false" aria-label="第一組名單"></textarea>
    <div class="row"><input type="text" class="lab" id="l2" value="B組" aria-label="第二組名稱"><span class="meta" id="c2"></span></div>
    <textarea id="g2" spellcheck="false" placeholder="沒有第二組可以留空" aria-label="第二組名單"></textarea>
    <div class="sub">一行一個名字。上面是範例名單，請改成實際參加的人。人數不是 4 的倍數時，會讓輪空次數最少的人先上場。</div>
  </section>

  <div class="row"><h2>抽籤結果</h2><button class="small-btn" id="clear" type="button">清除所有紀錄</button></div>
  <div id="rounds"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="msg" id="msg" role="status"></div>
    <div class="btns">
      <button id="draw" type="button">抽下一輪</button>
      <button id="redo" type="button">重抽本輪</button>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "badminton-v1";
  var mode = "mix";
  var rounds = [];
  var TRIES = 4000;

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        mode: mode, rounds: rounds, g1: $("g1").value, g2: $("g2").value, l1: $("l1").value, l2: $("l2").value
      }));
    } catch (e) {}
  }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }

  function parse(t) {
    var seen = {}, out = [];
    t.split(/[\n,，、]+/).forEach(function (s) { s = s.trim(); if (s && !seen[s]) { seen[s] = 1; out.push(s); } });
    return out;
  }
  function rnd(n) {
    var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n, x;
    do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim);
    return x % n;
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function key(a, b) { return a < b ? a + "\u0001" + b : b + "\u0001" + a; }

  // Build counts of past partners, opponents and rests from rounds.
  function history(list) {
    var P = {}, O = {}, R = {};
    list.forEach(function (r) {
      r.groups.forEach(function (g) {
        g.bench.forEach(function (n) { R[n] = (R[n] || 0) + 1; });
        g.matches.forEach(function (m) {
          var t1 = m[0], t2 = m[1];
          P[key(t1[0], t1[1])] = (P[key(t1[0], t1[1])] || 0) + 1;
          P[key(t2[0], t2[1])] = (P[key(t2[0], t2[1])] || 0) + 1;
          t1.forEach(function (a) { t2.forEach(function (b) { O[key(a, b)] = (O[key(a, b)] || 0) + 1; }); });
        });
      });
    });
    return { P: P, O: O, R: R };
  }

  function score(order, H) {
    var s = 0;
    for (var i = 0; i + 3 < order.length; i += 4) {
      var a = order[i], b = order[i + 1], c = order[i + 2], d = order[i + 3];
      var p1 = H.P[key(a, b)] || 0, p2 = H.P[key(c, d)] || 0;
      s += (p1 * p1 + p2 * p2) * 10;
      [[a, c], [a, d], [b, c], [b, d]].forEach(function (x) { s += (H.O[key(x[0], x[1])] || 0) * 3; });
    }
    return s;
  }

  function drawGroup(label, names, H) {
    var n = names.length;
    if (n < 4) return { label: label, err: label + " 只有 " + n + " 人，至少要 4 人才能分隊。" };
    var restN = n % 4;
    var bench = [];
    if (restN) {
      var withRand = shuffle(names).map(function (nm, i) { return { nm: nm, r: H.R[nm] || 0, i: i }; });
      withRand.sort(function (x, y) { return x.r - y.r || x.i - y.i; });
      // players with the fewest rests are the ones who sit out? No: sit out those with fewest rests so far.
      bench = withRand.slice(0, restN).map(function (x) { return x.nm; });
    }
    var active = names.filter(function (x) { return bench.indexOf(x) < 0; });
    var best = Infinity, pool = [];
    for (var t = 0; t < TRIES; t++) {
      var o = shuffle(active), sc = score(o, H);
      if (sc < best) { best = sc; pool = [o]; }
      else if (sc === best && pool.length < 200) pool.push(o);
      if (best === 0 && pool.length >= 50) break;
    }
    var order = pool[rnd(pool.length)];
    var matches = [];
    for (var i = 0; i < order.length; i += 4) {
      matches.push([[order[i], order[i + 1]], [order[i + 2], order[i + 3]]]);
    }
    // repeat stats vs. history
    var rp = 0, ro = 0;
    matches.forEach(function (m) {
      [m[0], m[1]].forEach(function (tm) { if (H.P[key(tm[0], tm[1])]) rp++; });
      m[0].forEach(function (a) { m[1].forEach(function (b) { if (H.O[key(a, b)]) ro++; }); });
    });
    return { label: label, order: order, matches: matches, bench: bench, rp: rp, ro: ro };
  }

  function groupsNow() {
    var a = parse($("g1").value), b = parse($("g2").value);
    var l1 = $("l1").value.trim() || "A組", l2 = $("l2").value.trim() || "B組";
    var seen = {};
    a.forEach(function (x) { seen[x] = 1; });
    b = b.filter(function (x) { return !seen[x]; });
    if (mode === "mix") return [{ label: "全部", names: a.concat(b) }];
    var out = [{ label: l1, names: a }];
    if (b.length) out.push({ label: l2, names: b });
    return out;
  }

  function doDraw() {
    var H = history(rounds), gs = groupsNow(), res = [], errs = [];
    gs.forEach(function (g) {
      var r = drawGroup(g.label, g.names, H);
      if (r.err) errs.push(r.err); else res.push(r);
    });
    if (errs.length) { $("msg").textContent = errs.join(" "); return false; }
    $("msg").textContent = "";
    rounds.push({ no: rounds.length + 1, groups: res });
    save(); render();
    return true;
  }

  function chip(no, name) {
    var s = document.createElement("span"); s.className = "rc";
    var n = document.createElement("span"); n.className = "no"; n.textContent = no;
    s.appendChild(n); s.appendChild(document.createTextNode(name));
    return s;
  }
  function player(no, name) {
    var d = document.createElement("div"); d.className = "p";
    var n = document.createElement("span"); n.className = "no"; n.textContent = no;
    var t = document.createElement("span"); t.className = "t"; t.textContent = name;
    d.appendChild(n); d.appendChild(t);
    return d;
  }

  function renderRound(r, latest) {
    var card = document.createElement("div");
    card.className = "round" + (latest ? " latest" : "");
    var h = document.createElement("div"); h.className = "round-h";
    var t = document.createElement("h2"); t.textContent = "第 " + r.no + " 輪";
    h.appendChild(t);
    var rp = 0, ro = 0;
    r.groups.forEach(function (g) { rp += g.rp; ro += g.ro; });
    var rep = document.createElement("span");
    rep.className = "rep " + (rp + ro === 0 ? "good" : "bad");
    rep.textContent = r.no === 1 ? "第一輪沒有歷史紀錄" : "與前幾輪相比：重複隊友 " + rp + " 組、重複對手 " + ro + " 組";
    h.appendChild(rep);
    card.appendChild(h);

    var court = 0;
    r.groups.forEach(function (g) {
      var sec = document.createElement("div");
      sec.style.cssText = "display:flex;flex-direction:column;gap:10px;min-width:0";
      if (r.groups.length > 1) {
        var gn = document.createElement("div"); gn.className = "gname"; gn.textContent = g.label; sec.appendChild(gn);
      }
      var ro2 = document.createElement("div"); ro2.className = "roster";
      var num = {};
      g.order.forEach(function (nm, i) { num[nm] = i + 1; ro2.appendChild(chip(i + 1, nm)); });
      sec.appendChild(ro2);
      g.matches.forEach(function (m) {
        court++;
        var row = document.createElement("div"); row.className = "match";
        var c = document.createElement("div"); c.className = "court"; c.textContent = "場地 " + court;
        var tm = document.createElement("div"); tm.className = "teams";
        [m[0], m[1]].forEach(function (team, idx) {
          var box = document.createElement("div"); box.className = "team";
          team.forEach(function (nm) { box.appendChild(player(num[nm], nm)); });
          tm.appendChild(box);
          if (idx === 0) { var v = document.createElement("div"); v.className = "vs"; v.textContent = "對"; tm.appendChild(v); }
        });
        row.appendChild(c); row.appendChild(tm); sec.appendChild(row);
      });
      if (g.bench.length) {
        var b = document.createElement("div"); b.className = "bench"; b.textContent = "本輪輪空：" + g.bench.join("、");
        sec.appendChild(b);
      }
      card.appendChild(sec);
    });
    return card;
  }

  function render() {
    $("m-mix").setAttribute("aria-pressed", mode === "mix");
    $("m-sep").setAttribute("aria-pressed", mode === "sep");
    $("mode-note").textContent = mode === "mix"
      ? "兩份名單合成同一批人，一起抽號碼，場地連續排。"
      : "每組各自抽號碼、各自配對，場地依序往下排（例如新手 8 人用場地 1、2，老手 8 人用場地 3、4）。";
    $("c1").textContent = parse($("g1").value).length + " 人";
    $("c2").textContent = parse($("g2").value).length + " 人";
    $("redo").disabled = rounds.length === 0;
    var box = $("rounds"); box.innerHTML = "";
    if (!rounds.length) {
      var e = document.createElement("div"); e.className = "empty panel"; e.textContent = "按下「抽下一輪」開始。每按一次就是新的一輪，會參考前面的結果。";
      box.appendChild(e); return;
    }
    var wrap = document.createElement("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:12px";
    for (var i = rounds.length - 1; i >= 0; i--) wrap.appendChild(renderRound(rounds[i], i === rounds.length - 1));
    box.appendChild(wrap);
  }

  var s = load();
  $("g1").value = s && typeof s.g1 === "string" ? s.g1 : "A\nB\nC\nD\nE\nF\nG\nH";
  $("g2").value = s && typeof s.g2 === "string" ? s.g2 : "";
  if (s) { if (s.l1) $("l1").value = s.l1; if (s.l2) $("l2").value = s.l2; mode = s.mode || "mix"; rounds = s.rounds || []; }

  ["g1", "g2", "l1", "l2"].forEach(function (id) { $(id).addEventListener("input", function () { render(); save(); }); });
  $("m-mix").addEventListener("click", function () { mode = "mix"; render(); save(); });
  $("m-sep").addEventListener("click", function () { mode = "sep"; render(); save(); });
  $("draw").addEventListener("click", doDraw);
  $("redo").addEventListener("click", function () {
    if (!rounds.length) return;
    var removed = rounds.pop();
    if (!doDraw()) rounds.push(removed);
  });
  $("clear").addEventListener("click", function () { rounds = []; $("msg").textContent = ""; save(); render(); });
  render();
})();
</script>

</body>
</html>
